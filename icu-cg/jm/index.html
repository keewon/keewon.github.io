<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Your choice in this season !!</title>
<style>
	html, body {
		margin: 0;
		padding: 0;
		height: 100%;
		background: #000;
		overflow: hidden;
		font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
	}
	#glcanvas {
		display: block;
		width: 100%;
		height: 100%;
		outline: none;
	}
	#help {
		position: fixed;
		left: 12px;
		bottom: 12px;
		color: #cfcfcf;
		font-size: 12px;
		line-height: 1.6;
		text-shadow: 0 1px 2px #000;
		pointer-events: none;
		opacity: 0.75;
	}
	#help b { color: #fff; }
	#hint {
		display: none;
		position: fixed;
		left: 50%;
		top: 24px;
		transform: translateX(-50%);
		padding: 8px 16px;
		border-radius: 4px;
		background: rgba(0, 0, 0, 0.6);
		border: 1px solid #444;
		color: #eee;
		font-size: 13px;
	}
</style>
</head>
<body>
	<canvas id="glcanvas" tabindex="0"></canvas>
	<div id="hint">화면을 클릭하거나 아무 키나 누르면 음악이 재생됩니다.</div>
	<div id="help">
		<b>↑ / ↓</b> 육각기둥 선택 &nbsp;·&nbsp;
		<b>← / →</b> 한 칸 돌리기 &nbsp;·&nbsp;
		<b>Space</b> 두 기둥 돌리기 &nbsp;·&nbsp;
		<b>Esc</b> 음악 정지
	</div>

	<script src="gl.js"></script>
	<script src="light.js"></script>
	<script src="flag.js"></script>
	<script src="music.js"></script>
	<script src="jm.js"></script>
</body>
</html>
